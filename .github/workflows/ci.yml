name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daysheet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/daysheet?schema=public
      REDIS_URL: redis://127.0.0.1:6380
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DEMO_CLOCK: '2026-04-20'
      API_URL: http://127.0.0.1:3101
      WEB_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Environment file
        run: |
          cp .env.example .env
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=${DATABASE_URL}#" .env
          sed -i "s#^REDIS_URL=.*#REDIS_URL=${REDIS_URL}#" .env
          sed -i "s#^AUTH_SECRET=.*#AUTH_SECRET=${AUTH_SECRET}#" .env
          sed -i "s#^DEMO_CLOCK=.*#DEMO_CLOCK=${DEMO_CLOCK}#" .env

      - name: Domain — build and test
        run: |
          pnpm --filter @daysheet/domain lint
          pnpm --filter @daysheet/domain build
          pnpm --filter @daysheet/domain test

      - name: Database — migrate and seed
        run: |
          pnpm --filter @daysheet/db build
          pnpm --filter @daysheet/db migrate:deploy
          pnpm --filter @daysheet/db seed

      - name: API — lint, typecheck, test, build
        run: |
          pnpm --filter api lint
          pnpm --filter api typecheck
          pnpm check:architecture
          pnpm --filter api test
          pnpm --filter api build

      - name: Web — lint, typecheck, build
        run: |
          pnpm --filter web lint
          pnpm --filter web typecheck
          pnpm --filter web build

      - name: Format, licenses, advisories, copy
        run: |
          pnpm format:check
          pnpm check:licenses
          pnpm audit --audit-level=high --prod
          pnpm check:copy

      - name: End to end — boot both apps and run Playwright
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          # The apps run as they would in production: workers on, the lab open, Ask offline — not as a test
          # module, whose jobs never leave the ledger and whose parked sync would keep the books down.
          (cd apps/api && NODE_ENV=production LAB_ENABLED=true ASK_PROVIDER=offline node dist/main.js > api.log 2>&1 &)
          # Auth.js in production trusts only a host it is told to (AUTH_URL, AUTH_TRUST_HOST, or a known platform); told nothing, sign-in sets no cookie.
          (cd apps/web && NODE_ENV=production AUTH_TRUST_HOST=true pnpm start > web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3101/health >/dev/null && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/login >/dev/null && break; sleep 1; done
          pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/web/test-results
            apps/api/api.log
            apps/web/web.log
          if-no-files-found: ignore
