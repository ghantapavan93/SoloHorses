# Render Blueprint — the API and its Redis on the free plan, one service, no card.
#
#   Dashboard → New → Blueprint → this repository → Apply. Render prompts for the values
#   marked `sync: false` (Neon's connection string, the secret shared with the web, the
#   web's URL) and reads everything else from here. docs/DEPLOY.md is the runbook.
#
# One web service, one process, no Redis: the free plan allows one always-on instance per
# workspace and one free Key Value, and a workspace that already has either would refuse the
# second. Without REDIS_URL the API runs its jobs inline from the ledger and keeps its cache and
# rate limits in memory — the same rules, the same records. Set REDIS_URL later to move the
# queues onto a Redis. The service migrates and seeds the synthetic world on its first boot
# (SEED_ON_EMPTY) and never resets a world someone is in the middle of.
services:
  - type: web
    name: daysheet-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Liveness only: the full /health reads the database, and a probe every few seconds would keep Neon's compute awake.
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: TRUST_PROXY
        value: 'on'
      - key: SEED_ON_EMPTY
        value: 'true'
      - key: DEMO_CLOCK
        value: '2026-04-20'
      - key: LAB_ENABLED
        value: 'true'
      - key: ASK_PROVIDER
        value: auto
      - key: NODE_OPTIONS
        value: '--max-old-space-size=400'
      # These three are set in the dashboard (Environment), never here. A sync that fails before the
      # service exists drops what was typed at the prompt: after a failed first sync, check that all
      # three are present, or the entrypoint stops at once and says which one is missing.
      # Neon's direct (non-pooled) connection string, `?sslmode=require`; the same database the web reads through the API.
      - key: DATABASE_URL
        sync: false
      # The same value on Vercel: the web mints the API's per-request tokens with it.
      - key: AUTH_SECRET
        sync: false
      # The web's public URL, once Vercel has one (CORS and where the API sends a browser back to).
      - key: WEB_URL
        sync: false
